baseURL: https://yxxbc.github.io/
locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true
title: Black Cat
enableRobotsTXT: true
capitalizeListTitles: false

outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML]

outputFormats:
  RSS:
    baseName: rss

services:
  rss:
    limit: 20

permalinks:
  page:
    post: /p/:slug/

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
    guessSyntax: true
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  description: Black Cat 的博客，记录技术折腾与日常思考。
  subtitle: 生命不止，折腾不息
  github: https://github.com/yxxbc
  googleSiteVerification: 2dTPklx6cOydPSINuCHxypLaCezdhnuyPBVY7rd189s

menus:
  main:
    - name: 文章
      pageRef: /post
      weight: 10
    - name: 分类
      pageRef: /categories
      weight: 20
    - name: 友链
      pageRef: /friends
      weight: 30
    - name: 关于
      pageRef: /about
      weight: 40
