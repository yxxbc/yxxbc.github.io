<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{ "" | relURL }}" aria-label="{{ site.Title }} 首页">
      {{- partial "cat.html" . -}}
      <span>{{ site.Title }}</span>
    </a>
    <nav class="nav" aria-label="主导航">
      {{- $current := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (and .Page .Page.Section (eq $current.Section .Page.Section)) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <a class="icon-btn" href="{{ "search/" | relURL }}" aria-label="搜索" title="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
