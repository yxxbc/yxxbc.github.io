{{- $dest := .Destination -}}
{{- $external := or (strings.HasPrefix $dest "http://") (strings.HasPrefix $dest "https://") -}}
{{- if $external -}}
{{- $host := $dest | replaceRE "^https?://([^/]+).*$" "$1" -}}
<a class="link-card" data-url="{{ $dest }}" href="{{ $dest | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }} target="_blank" rel="noopener noreferrer">
  <span class="link-card-title">{{ .Text | safeHTML }}</span>
  <span class="link-card-meta">
    <span class="link-card-host">{{ $host }}</span>
    <span class="link-card-arrow">↗</span>
  </span>
</a>
{{- else -}}
<a href="{{ $dest | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
{{- end -}}
