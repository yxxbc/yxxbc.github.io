<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  <a class="skip" href="#main">跳到正文</a>
  {{- partial "header.html" . }}
  <main id="main" class="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
