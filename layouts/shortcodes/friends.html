<div class="friends-list">
  {{- range .Site.Data.friends -}}
  <a class="friend-card" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
    <div class="friend-avatar-container">
      <img loading="lazy" src="{{ .avatar }}" alt="{{ .name }}'s avatar">
    </div>
    <div class="friend-info">
      <div class="friend-name">{{ .name }}</div>
      <p class="friend-description">{{ .description }}</p>
    </div>
  </a>
  {{- end -}}
</div>

<style>
.friends-list {
    display: flex;
    flex-wrap: wrap;
    gap: var(--gap);
    justify-content: start;
    padding: 10px 0;
    margin-bottom: var(--gap);
}
.friend-card {
    display: flex;
    align-items: stretch;
    height: 100px;
    flex: 1 1 300px;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: none !important;
    padding: 0;
    overflow: hidden;
    transition: box-shadow 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
    text-decoration: none;
    color: inherit;
    text-align: left;
}
.friend-card:hover {
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    border-color: var(--primary);
    transform: translateY(-3px);
}
.dark .friend-card:hover {
    box-shadow: 0 4px 10px rgba(255,255,255,0.1);
}
.friend-avatar-container {
    flex-shrink: 0;
    width: 80px;
    height: 100%;
    overflow: hidden;
}
.friend-avatar-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 0 !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
}
.friend-info {
    flex-grow: 1;
    min-width: 0;
    padding: 5px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
}
.friend-name {
    font-size: 17px;
    margin-top: 3px;
    font-weight: bold;
    color: var(--primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.friend-description {
    font-size: 13px;
    padding-top: 2px;
    color: var(--secondary);
    margin: 0;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
    -webkit-line-clamp: 2;
    height: auto;
}
@media(min-width: 992px) {
    .friend-card {
        flex: 1 1 calc((100% - 2 * var(--gap)) / 3);
        max-width: calc((100% - 2 * var(--gap)) / 3);
    }
}
@media(min-width: 576px) and (max-width: 991px) {
    .friend-card {
        flex: 1 1 calc((100% - var(--gap)) / 2);
        max-width: calc((100% - var(--gap)) / 2);
    }
}
</style>
